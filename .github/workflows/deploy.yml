name: Deploy

# main 推送的 CI 成功后，部署其固定提交到阿里云 ECS。
# 部署分两阶段：先在临时 worktree 中用生产 .env 校验目标版本、拉取依赖镜像并构建，
# 只有预检成功才更新 /opt/chatcircle 的 main 并启动同一提交的预构建镜像。
# 这样缺失生产环境变量、镜像拉取或 Docker 构建失败时，不会先改动生产工作区。
#
# 所需 Secrets（Settings → Secrets and variables → Actions）：
#   ECS_SSH_PRIVATE_KEY  部署专用私钥（对应公钥已加入服务器 authorized_keys）
#   ECS_HOST             服务器地址
#   ECS_USER             登录用户
#
# 生产应用 secrets 仍只保存在 ECS /opt/chatcircle/.env，不写入仓库或 Actions 日志。
# ICP 备案完成后生产 Compose 已固定为标准 80/443；服务器侧 legacy
# docker-compose.override.yml 会被拒绝，避免旧的 8443/明文临时配置继续覆盖仓库配置。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: '要部署的完整提交 SHA（必须已有 CI 成功）'
        required: true
        type: string

# 部署不取消中途运行，避免半截部署；新提交排队等上一次部署完成
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 验证固定提交的 CI 成功
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.verify.outputs.target_sha }}
    steps:
      - id: verify
        name: 验证 CI 运行结果
        uses: actions/github-script@v7
        env:
          REQUESTED_SHA: ${{ inputs.deploy_sha }}
        with:
          script: |
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : process.env.REQUESTED_SHA || '';
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`部署 SHA 必须是 40 位十六进制值：${sha}`);
              return;
            }
            if (context.eventName === 'workflow_run'
                && (context.payload.workflow_run.conclusion !== 'success'
                  || context.payload.workflow_run.event !== 'push'
                  || context.payload.workflow_run.head_branch !== 'main')) {
              core.setFailed(`CI 未成功（${context.payload.workflow_run.conclusion || '未完成'}），拒绝部署 ${sha}`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              status: 'completed',
              per_page: 20,
            });
            const success = data.workflow_runs.some((run) => run.conclusion === 'success'
              && run.event === 'push' && run.head_branch === 'main' && run.head_sha === sha);
            if (!success) {
              core.setFailed(`未找到提交 ${sha} 的成功 CI 运行，拒绝部署`);
              return;
            }
            core.setOutput('target_sha', sha);
            core.info(`CI success verified for ${sha}`);

  deploy:
    name: 预检并部署到阿里云 ECS
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 预检目标版本并构建
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$ECS_USER@$ECS_HOST" 'bash -se --' "$DEPLOY_SHA" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/chatcircle
          target_sha="$1"
          export CC_RELEASE_SHA="$target_sha"

          if [ -f docker-compose.override.yml ]; then
            echo "ERROR: 检测到 legacy /opt/chatcircle/docker-compose.override.yml。ICP备案完成后的正式部署禁止服务器侧 override；请先备份并移除该文件。" >&2
            exit 1
          fi

          git fetch --prune origin main "$target_sha"
          git cat-file -e "$target_sha^{commit}"
          project_name="$(basename "$PWD")"
          preflight_project="${project_name}-preflight"
          candidate_dir="$(mktemp -d /tmp/chatcircle-deploy.XXXXXX)"
          # git worktree add 要求目标路径尚不存在；mktemp 这里只负责安全地产生唯一名称。
          rmdir "$candidate_dir"

          cleanup() {
            cd /opt/chatcircle || true
            if [ -d "$candidate_dir" ]; then
              docker compose --project-name "$preflight_project" -f "$candidate_dir/docker-compose.yml" down -v --remove-orphans >/dev/null 2>&1 || true
            fi
            git worktree remove --force "$candidate_dir" >/dev/null 2>&1 || rm -rf "$candidate_dir"
          }
          trap cleanup EXIT

          echo "Preflight target: $target_sha"
          git worktree add --detach "$candidate_dir" "$target_sha"

          if [ ! -f .env ]; then
            echo "ERROR: /opt/chatcircle/.env 不存在，拒绝部署" >&2
            exit 1
          fi
          cp .env "$candidate_dir/.env"
          chmod 600 "$candidate_dir/.env"

          cd "$candidate_dir"

          # Compose 在真正构建前完成所有 ${VAR:?message} 校验。
          # 因此未来新增必需生产变量时，无需在 workflow 里维护 Compose 变量名单。
          echo "Validating Docker Compose configuration..."
          docker compose config -q

          # 先拉取 image-only 服务（尤其正式切换后的官方 Caddy 镜像），避免生产 main
          # 更新后才发现镜像不可获取。不会启动或替换生产容器。
          echo "Pulling candidate runtime images..."
          docker compose --project-name "$preflight_project" pull caddy backup

          # 用独立 project name 构建候选镜像，不触碰当前运行中的容器。
          # 正式部署直接使用这个按提交 SHA 标记的镜像，不再次构建。
          echo "Building candidate images..."
          docker compose --project-name "$preflight_project" build

          # Compose 的 :? 只能验证非空；手机号 HMAC key 还有 >=32 字符的运行时约束，
          # 生产短信凭据/场景模板在 production+aliyun 时必须全部非空。这里在隔离 project 的
          # 候选 app 容器内校验（变量已实际注入容器），不挂生产端口、不启动依赖、也不接触生产 pb_data。
          docker compose --project-name "$preflight_project" run --rm --no-deps --entrypoint sh app -eu -c '
            if [ "${#CC_PHONE_HASH_KEY}" -lt 32 ]; then
              echo "ERROR: CC_PHONE_HASH_KEY 必须至少 32 字符" >&2
              exit 1
            fi
            sms_provider="$(printf "%s" "${CC_SMS_PROVIDER:-}" | tr "A-Z" "a-z")"
            if [ "${CC_ENVIRONMENT:-}" = "production" ] && [ "$sms_provider" = "aliyun" ]; then
              missing=""
              for name in \
                ALIBABA_CLOUD_ACCESS_KEY_ID \
                ALIBABA_CLOUD_ACCESS_KEY_SECRET \
                CC_SMS_SIGN_NAME \
                CC_SMS_TEMPLATE_LOGIN_REGISTER_CODE \
                CC_SMS_TEMPLATE_BIND_NEW_CODE \
                CC_SMS_TEMPLATE_VERIFY_BOUND_CODE; do
                if [ -z "$(printenv "$name")" ]; then
                  if [ -n "$missing" ]; then missing="$missing $name"; else missing="$name"; fi
                fi
              done
              if [ -n "$missing" ]; then
                echo "ERROR: 生产短信必填变量缺失（仅列变量名，不含值）: $missing" >&2
                exit 1
              fi
            fi
          '
          REMOTE

      - name: 更新生产版本并健康检查
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$ECS_USER@$ECS_HOST" 'bash -se --' "$DEPLOY_SHA" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/chatcircle
          target_sha="$1"
          export CC_RELEASE_SHA="$target_sha"

          previous_sha="$(git rev-parse HEAD)"
          git cat-file -e "$target_sha^{commit}"
          echo "Deploying: $previous_sha -> $target_sha"

          # A queued old run must not silently deploy a newer local main.
          git merge-base --is-ancestor "$previous_sha" "$target_sha"
          docker image inspect "chatcircle-app:$target_sha" >/dev/null
          # Keep an application-consistent recovery point before automatic migrations.
          docker compose exec -T backup sh /etc/periodic/daily/backup

          git checkout main
          git merge --ff-only "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"

          # Run the exact image built during preflight, without a second build/pull.
          docker compose up --no-build --pull never -d

          # 生产 app 不向 host 发布 8090；按容器 healthcheck 状态判定健康。
          # 最多等待约 90 秒（45 × 2s）。
          app_id="$(docker compose ps -q app)"
          if [ -z "$app_id" ]; then
            echo "ERROR: app 容器未创建" >&2
            docker compose ps || true
            exit 1
          fi
          healthy=0
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || echo '')"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "ERROR: 部署后 app 容器健康检查失败（90 秒内未达 healthy）" >&2
            docker compose ps || true
            docker compose logs --tail=120 app || true
            exit 1
          fi

          docker compose ps
          revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$app_id")"
          test "$revision" = "$target_sha"
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 20 \
            https://chatcircle.empact.cn/api/cc/health >/dev/null
          echo "Deploy healthy: $target_sha"
          REMOTE
