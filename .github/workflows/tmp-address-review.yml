name: Temporary review fixer

on:
  push:
    branches:
      - fix/production-https-443-20260904

permissions:
  contents: write

jobs:
  patch-review-feedback:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-https-443-20260904

      - name: Patch stale production HTTPS references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          importer = Path('backend/scripts/import_historical_20260612.py')
          text = importer.read_text()
          old = 'https://chatcircle.empact.cn:8443'
          if text.count(old) != 1:
              raise SystemExit(f'{importer}: expected exactly one legacy endpoint, found {text.count(old)}')
          importer.write_text(text.replace(old, 'https://chatcircle.empact.cn'))

          guide = Path('docs/developer-guide.md')
          text = guide.read_text()
          pattern = re.compile(
              r'Docker 一键启动（生产同构）：.*?日常本地开发更推荐上面的原生启动方式。',
              re.S,
          )
          replacement = (
              'Docker 一键启动（生产同构）：`cp .env.example .env` → **先填好 `.env`** → '
              '`docker compose up --build`。当前 compose 只对三个变量使用 `${VAR:?}` 启动前必填校验：'
              '`CC_PHONE_HASH_KEY`（手机号 HMAC 密钥）、`PB_SUPERUSER_EMAIL` / '
              '`PB_SUPERUSER_PASSWORD`（backup 服务登录用超管）。生产环境使用 `CC_SMS_PROVIDER=aliyun` 时，'
              'Deploy workflow 还会在更新生产版本前校验 `ALIBABA_CLOUD_ACCESS_KEY_ID` / '
              '`ALIBABA_CLOUD_ACCESS_KEY_SECRET`、`CC_SMS_SIGN_NAME` 和三个场景短信模板 CODE；这些短信凭据与 '
              'Caddy 无关。ICP备案完成后的 Caddy 使用标准 80/443 Automatic HTTPS，不再需要 '
              '`ALIYUN_ACCESS_KEY_ID` / `ALIYUN_ACCESS_KEY_SECRET` 或 DNS-01。**生产基础 compose 默认不向 host '
              '发布 app 的 `8090`**——要本机直连调试，需显式叠加 '
              '`docker compose -f docker-compose.yml -f deploy/docker-compose.debug.yml up -d` 发布回环 '
              '`127.0.0.1:8090`（该 override 存在「本地伪造 XFF」风险，见 deploy/README.md，仅限知悉下使用）。'
              '日常本地开发更推荐上面的原生启动方式。'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'{guide}: expected one Docker setup paragraph, replaced {count}')
          guide.write_text(text)
          PY

          git diff --check
          git diff -- backend/scripts/import_historical_20260612.py docs/developer-guide.md

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/scripts/import_historical_20260612.py docs/developer-guide.md
          git commit -m 'fix(docs): address HTTPS review feedback [skip-review-fix]'
          git push origin HEAD:fix/production-https-443-20260904
