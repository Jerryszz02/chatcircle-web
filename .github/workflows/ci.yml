name: CI

# 全部 job 均为 PR 必过（test-plan §8）。
# 建议在 GitHub 仓库设置中对 main 启用 branch protection：
#   Settings → Branches → Add rule → 要求 "frontend"、"backend-migrations" 与
#   "backend-integration" 状态检查通过后方可合并。

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 新提交取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PB_VERSION: '0.28.4'

jobs:
  frontend:
    name: frontend (lint / typecheck / unit / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend-migrations:
    name: backend (pocketbase migrate + hooks 语法检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载 PocketBase ${{ env.PB_VERSION }}
        run: |
          curl -fSL -o /tmp/pocketbase.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o /tmp/pocketbase.zip -d /tmp/pocketbase
          /tmp/pocketbase/pocketbase --version
      - name: 空目录跑通全部迁移
        run: |
          /tmp/pocketbase/pocketbase migrate up \
            --dir /tmp/pb_ci_data \
            --migrationsDir "${{ github.workspace }}/backend/pb_migrations"
      - name: pb_hooks 语法检查（node --check）
        run: |
          find backend/pb_hooks -name '*.pb.js' -print0 | while IFS= read -r -d '' f; do
            echo "checking $f"
            node --check "$f"
          done
      - name: T7 发布配置与隐私不变量
        run: |
          node deploy/verify-release-config.mjs
          node --test deploy/verify-release-config.test.mjs

  backend-integration:
    # L3 服务端集成套件（test-plan §3/§8，integration job；越权矩阵 AC-03 含在其中独立成组）。
    # 套件自举临时 PocketBase 实例（临时数据目录 → 全部迁移 → 测试超管 → 模板 SQL fixture →
    # 显式三目录参数 serve），只断言 API 行为与数据终态；任一断言失败退出码非零。
    name: backend (集成测试：越权 AC-03 / 名额并发 AC-08 / 状态机 AC-07 / 签到 AC-09 / 问卷 / 导出 AC-16/17 / 限流 AC-21 / 备份 AC-23 / 无硬删除 AC-18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载 PocketBase ${{ env.PB_VERSION }}
        run: |
          curl -fSL -o /tmp/pocketbase.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o /tmp/pocketbase.zip -d backend/
          backend/pocketbase --version
      - name: 运行后端集成测试套件（runner 已有 python3，无其他系统依赖）
        run: bash backend/tests/run_integration.sh
