services:
  app:
    image: chatcircle-app:${CC_RELEASE_SHA:-local}
    build:
      context: .
      args:
        PB_VERSION: ${PB_VERSION:-0.39.7}
        CC_RELEASE_SHA: ${CC_RELEASE_SHA:-local}
        VITE_PB_URL: ${VITE_PB_URL:-}
    # 生产默认不向 host 发布 PocketBase 端口（安全审查 finding 8、CWE-345）：
    # 后端只在 Docker 私网内供 Caddy/backup 访问（app:8090），避免本地不可信进程
    # 直连回环 8090 并伪造 X-Forwarded-For，绕过按来源 IP 的限流与审计归因。
    # 需要本机直连调试（或 TLS 就绪前 MCP 经 SSH 隧道访问）时，显式附加 debug override：
    #   docker compose -f docker-compose.yml -f deploy/docker-compose.debug.yml up
    # 该 override 会重新发布 127.0.0.1:8090:8090，并再次暴露「本地伪造 XFF」风险，仅在知悉下使用。
    volumes:
      - pb_data:/pb/pb_data
    environment:
      CC_ENVIRONMENT: ${CC_ENVIRONMENT:-production}
      CC_SMS_PROVIDER: ${CC_SMS_PROVIDER:-aliyun}
      CC_PHONE_HASH_KEY: ${CC_PHONE_HASH_KEY:?app 需要至少 32 字符的手机号 HMAC 密钥}
      CC_PHONE_CODE_IP_MAX: ${CC_PHONE_CODE_IP_MAX:-200}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      CC_SMS_SIGN_NAME: ${CC_SMS_SIGN_NAME:-}
      CC_SMS_TEMPLATE_LOGIN_REGISTER_CODE: ${CC_SMS_TEMPLATE_LOGIN_REGISTER_CODE:-}
      CC_SMS_TEMPLATE_BIND_NEW_CODE: ${CC_SMS_TEMPLATE_BIND_NEW_CODE:-}
      CC_SMS_TEMPLATE_VERIFY_BOUND_CODE: ${CC_SMS_TEMPLATE_VERIFY_BOUND_CODE:-}
      CC_SMS_TEMPLATE_CODE: ${CC_SMS_TEMPLATE_CODE:-}
      CC_SMS_SCHEME_NAME: ${CC_SMS_SCHEME_NAME:-}
      CC_PARTICIPANT_PRIVACY_NOTICE_VERSION: ${CC_PARTICIPANT_PRIVACY_NOTICE_VERSION:-2026-09-05.v1}
    restart: unless-stopped
    # 限制容器日志体积，避免 json-file 长期累积撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # 供 backup 服务 depends_on(service_healthy) 使用；镜像为 alpine 自带 busybox wget
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # 每日一致性备份（technical-design §5.8）：crond 每日执行 deploy/backup.sh，
  # 调 PocketBase 备份 API 生成 SQLite 一致快照（含 data.db + 上传文件），下载到
  # backups 卷滚动保留 ${BACKUP_RETENTION_DAYS} 天，结果写 backups 卷内 last_backup.json
  # 标记文件并写 audit_logs（backup.success/failed，驱动超管后台 backup-status 告警，
  # AC-23）。
  # TODO(待确认)：异地同步目标存储与凭据下发方式（§5.8，secrets 只在部署时注入）。
  backup:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # 备份 API 先把 ZIP 落盘 pb_data/backups，脚本下载成功后会删除该服务端副本，
      # 故本卷需可写；脚本不触碰 pb_data 内除 backups/ 副本外的任何文件
      - pb_data:/pbdata
      - backups:/backups
    environment:
      PB_URL: ${PB_BACKUP_URL:-http://app:8090}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?backup 服务需要超管邮箱（.env 注入，不入库）}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?backup 服务需要超管密码（.env 注入，不入库）}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # crond 每日任务按容器本地时区凌晨触发：默认 UTC 会落在北京时间上午，
      # 固定 Asia/Shanghai 让每日备份在业务低谷（北京 02:00）执行
      TZ: Asia/Shanghai
    # alpine 基础镜像未内置 tzdata，命名时区 Asia/Shanghai 需其数据文件，
    # 启动时安装时区数据与 util-linux（提供备份互斥锁 flock）。
    command: >
      sh -c "apk add --no-cache tzdata util-linux
      && mkdir -p /etc/periodic/daily
      && cp /deploy/backup.sh /etc/periodic/daily/backup
      && chmod +x /etc/periodic/daily/backup
      && crond -f -d 8"
    configs:
      - source: backup_script
        target: /deploy/backup.sh
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # HTTPS 反代：ICP备案完成后使用标准 80/443。
  # Caddy Automatic HTTPS 负责证书申请/续期和 HTTP→HTTPS 跳转，不再使用
  # 未备案时期的 :8443 + 阿里云 DNS-01，也不再需要 ALIYUN_ACCESS_KEY_*。
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书、ACME 账户和 Caddy 运行配置持久化，避免重启重复申请证书
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

configs:
  backup_script:
    file: ./deploy/backup.sh

# 恢复说明（AC-19，详细演练步骤见 deploy/README.md「恢复演练」）：
#   1) docker compose stop app（停机，二次确认为运维流程要求，V1 不做产品化一键恢复）；
#   2) 从 backups 卷取最近 cc_daily_*.zip，解压后以其中 data.db（及 storage/）覆盖 pb_data 卷；
#      也可反向使用 PocketBase 恢复：上传 ZIP 到 pb_data/backups 后用 POST /api/backups/{key}/restore；
#   3) docker compose start app，校验三端与数据完整性，并按 §5.8 要求补写恢复审计。
volumes:
  pb_data:
  backups:
  caddy_data:
  caddy_config:
