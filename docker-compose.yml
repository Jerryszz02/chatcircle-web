services:
  app:
    build:
      context: .
      args:
        PB_VERSION: ${PB_VERSION:-0.28.4}
        VITE_PB_URL: ${VITE_PB_URL:-}
    ports:
      # 只绑回环：对外流量一律走 caddy（HTTPS）；8090 仅保留本机调试入口
      - '127.0.0.1:8090:8090'
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped
    # 限制容器日志体积，避免 json-file 长期累积撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # 供 backup 服务 depends_on(service_healthy) 使用；镜像为 alpine 自带 busybox wget
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # 每日一致性备份（technical-design §5.8）：crond 每日执行 deploy/backup.sh，
  # 调 PocketBase 备份 API 生成 SQLite 一致快照（含 data.db + 上传文件），下载到
  # backups 卷滚动保留 ${BACKUP_RETENTION_DAYS} 天，结果写 backups 卷内 last_backup.json
  # 标记文件（与 super.pb.js backup/run 的分工见 deploy/README.md「备份分工」）。
  # TODO(待确认)：异地同步目标存储与凭据下发方式（§5.8，secrets 只在部署时注入）。
  backup:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # 备份 API 先把 ZIP 落盘 pb_data/backups，脚本下载成功后会删除该服务端副本，
      # 故本卷需可写；脚本不触碰 pb_data 内除 backups/ 副本外的任何文件
      - pb_data:/pbdata
      - backups:/backups
    environment:
      PB_URL: ${PB_BACKUP_URL:-http://app:8090}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?backup 服务需要超管邮箱（.env 注入，不入库）}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?backup 服务需要超管密码（.env 注入，不入库）}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # crond 每日任务按容器本地时区凌晨触发：默认 UTC 会落在北京时间上午，
      # 固定 Asia/Shanghai 让每日备份在业务低谷（北京 02:00）执行
      TZ: Asia/Shanghai
    # alpine 基础镜像未内置 tzdata，命名时区 Asia/Shanghai 需其数据文件，
    # 启动时安装（约 1MB），否则 TZ 解析失败会静默回落 UTC
    command: >
      sh -c "apk add --no-cache tzdata
      && mkdir -p /etc/periodic/daily
      && cp /deploy/backup.sh /etc/periodic/daily/backup
      && chmod +x /etc/periodic/daily/backup
      && crond -f -d 8"
    configs:
      - source: backup_script
        target: /deploy/backup.sh
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # HTTPS 反代（technical-design §5.7 / deploy/README.md §5）：Caddy 终止 TLS，
  # 经阿里云 DNS-01 挑战自动签发/续期 Let's Encrypt 证书（未备案期间 80/443 被
  # 拦截，HTTP-01 不可用，故走 DNS 验证；插件编译见 deploy/caddy.Dockerfile）。
  # 未备案期间对外端口为 8443，备案后改为 443 并去掉 Caddyfile 站点地址中的端口。
  caddy:
    build:
      context: ./deploy
      dockerfile: caddy.Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '8443:8443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账户持久化，避免重启重复签发触发 CA 限流
      - caddy_data:/data
    environment:
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:?caddy 需要阿里云 AccessKey ID 做 DNS-01 验证（.env 注入，不入库）}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:?caddy 需要阿里云 AccessKey Secret 做 DNS-01 验证（.env 注入，不入库）}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

configs:
  backup_script:
    file: ./deploy/backup.sh

# 恢复说明（AC-19，详细演练步骤见 deploy/README.md「恢复演练」）：
#   1) docker compose stop app（停机，二次确认为运维流程要求，V1 不做产品化一键恢复）；
#   2) 从 backups 卷取最近 cc_daily_*.zip，解压后以其中 data.db（及 storage/）覆盖 pb_data 卷；
#      也可反向使用 PocketBase 恢复：上传 ZIP 到 pb_data/backups 后用 POST /api/backups/{key}/restore；
#   3) docker compose start app，校验三端与数据完整性，并按 §5.8 要求补写恢复审计。
volumes:
  pb_data:
  backups:
  caddy_data:
